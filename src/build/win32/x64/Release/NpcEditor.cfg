	searchPath12="D:/Code/Galaxies-Reborn/stage-B-override"
	# -- priority 11: in-repo FALLBACK copy of the NpcEditor UI root (see block below).
	#    Relative, so it survives a clean checkout on any machine: SearchPath's ctor
	#    runs Os::getAbsolutePath against the CWD, which is this exe's directory.
	#    11, not 13: `maxSearchPriority=12` at the top of this file caps the scan loop
	#    (TreeFile.cpp:117,133) - anything above 12 is silently NEVER READ. Verified the
	#    hard way; 13 looked fine and did nothing. Sitting below stage-B-override's 12 is
	#    also the semantics we want: the override corpus keeps precedence, this is the net.
	#    NOTE a searchPath that does NOT exist is a hard FATAL, not a warning
	#    (TreeFile_SearchNode.cpp:117) - this one is tracked, so git always creates it.
	searchPath11="../../exe/win32"


[Station]
	gameFeatures=33297
	subscriptionFeatures=1

[ClientGraphics]
	# 11 = gl11 (D3D11). 9 is FATAL.
	rasterMajor=11
	windowed=true
	screenWidth=1280
	screenHeight=720

[SharedFoundation]
	ProductRegistryPath=Software/whitengold/Default
	lookUpCallStackNames=false

[SharedLog]
	logReportLogs=1

[NpcEditor]
	# Ported from SOE's NpcEditor.cfg (SWG All Tools Working tree), rebased.
	# backdrop: REQUIRED. MainWindow::slotChangeBackdrop reads this at startup
	# and hands it straight to NpcCuiViewer::setEnvironmentTexture, which does
	# std::string::append(NULL) if the key is absent -> access violation.
	backdrop=jedi
	# Server/shared/client template roots the editor reads and writes.
	defaultClientDsrc="D:/SWG All Tools Working/swg/current/dsrc/sku.0/sys.client/compiled/game/clientdata/npc"
	defaultClientRoot=clientdata
	defaultServerDsrc="D:/SWG All Tools Working/swg/current/dsrc/sku.0/sys.server/compiled/game/object/mobile"
	defaultServerRoot=object
	defaultSharedDsrc="D:/SWG All Tools Working/swg/current/dsrc/sku.0/sys.shared/compiled/game/object/mobile"
	defaultSharedRoot=object
	defaultWeaponDirectory="D:/SWG All Tools Working/swg/current/data/sku.0/sys.server/compiled/game/object/weapon"
	defaultWeaponRoot=object
	# wearableDirectory: SOE pointed this at
	#   data/sku.0/sys.client/exported/character/appearance/mesh
	# which does not exist in this copy of the tree. The same content lives
	# under compiled/game/appearance/mesh (4882 .lmg files) - the same
	# exported->compiled remap that applies to the string paths.
	# Plain QDir filesystem scan, not a TreeFile lookup.
	wearableDirectory="D:/SWG All Tools Working/swg/current/data/sku.0/sys.client/compiled/game/appearance/mesh"
	# Filesystem directory scanned for *.lmg wearable meshes (plain QDir scan, not a
	# TRE search path). Absent = empty wearable browser, which is correct here: this
	# dataset ships no loose .lmg files. Assigning the absent key used to crash the
	# editor at startup (strlen(NULL)); guarded in GameWidget.cpp as of 2026-08-23.

#--------------------------------------------------------------------
# NpcEditor-only UI root, added 2026-08-23.
# The /AvView page NpcCuiViewer requires is not in any TRE here, but it
# does exist loose in the SOE tree. per TreeFile.cpp:345.
# ui_root_npceditor.ui is SOE's OWN root (it defines /AvView inline), found
# loose in the SOE tree and copied to searchPath12 (stage-B-override,
# priority 12 - above swgsource_3.0.tre at 8 and base TREs at 0,
# Scoped to this cfg, so no other tool and not the client is affected.
#
# 2026-08-24: that copy lives OUTSIDE the repo, so a clean checkout got a tracked
# cfg pointing at a missing file and NpcEditor FATALed on the absent /AvView page.
# The file is now tracked at src/build/win32/exe/win32/ui/ui_root_npceditor.ui,
# beside the other preserved SOE originals (NpcEditor.tab, QuestEditorConfig.xml),
# and is reached by the relative searchPath11 above. stage-B-override is LEFT IN
# PLACE: it is the asm2hlsl corpus and serves other assets besides this one.
#--------------------------------------------------------------------

