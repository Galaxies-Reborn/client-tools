	#    (TreeFile.cpp:1027). Without a searchPath covering the .cef you want, the
	#    dialog silently does nothing and only warning.log says why.
	#    This directory is a valid TreeFile root: it holds appearance/, clienteffect/,
	#    sound/, quest/, terrain/ etc. exactly as they are named inside the TREs.
