	# searchTree_00_0). Tools call SetupSharedFile::install(useFileStreamer) and
	# never pass skuBits, so TreeFile::install builds key names WITHOUT the _NN_
	# sku segment. The client passes real skuBits and therefore needs the _00_
	# form -- that is why client.cfg differs and must NOT be synced to this file.
