[SharedLog]
	logReportLogs=1

[ParticleEditor]
	# Yes, [ParticleEditor] -- in THIS file. Every Qt tool built on the shared
	# swgClientQtWidgets GameWidget calls Game::install(Game::A_particleEditor)
	# (GameWidget.cpp:384), so ParticleEditor, AnimationEditor, SwooshEditor,
	# LightningEditor and ClientEffectEditor are all "the particle editor" as far
	# as Game.cpp is concerned, and all read the ground scene from the
	# [ParticleEditor] section of whatever cfg they happen to load
	# (ConfigClientGame.cpp:1088). A section named after this tool is silently
	# ignored -- do not add one.
	#
	# Without this key the compiled default terrain/simple.trn applies: a bare test
	# terrain with no environment family, so EnvironmentBlockManager returns its
	# default block, whose empty colorRampFileName takes the fallback in
	# EnvironmentBlock::loadColorRamps and paints the sky MAGENTA (255,0,255).
	# That is the magenta-sky symptom -- config, not a DX11 port defect.
	groundScene=terrain/tatooine.trn
