#--------------------------------------------------------------------
# SwgSpaceZoneEditor tool settings, added 2026-08-23.
# Ported from SOE's own cfg at
#   D:/SWG All Tools Working/swg/current/exe/win32/SwgSpaceZoneEditor.cfg
# with SOE's 'h:/swg/current' rebased onto the local copy of that tree.
# SOE's data/sku.0/sys.shared/built/game/... does not exist locally (only
# .../built/game/misc); the equivalent content lives under
# data/sku.0/sys.client/compiled/game/..., so those keys are remapped there.
# NOTE: do NOT touch the TreeFile keys above - they are the legacy no-sku
# form the tools require. See the header comment at the top of this file.
#--------------------------------------------------------------------
[SwgSpaceZoneEditor]
	spaceMobileDataTable="D:/SWG All Tools Working/swg/current/data/sku.0/sys.server/compiled/game/datatables/space_mobile/space_mobile.iff"
