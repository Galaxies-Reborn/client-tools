[Station]
	gameFeatures=33297
	subscriptionFeatures=1

[ClientGraphics]
	# 11 = gl11 (D3D11). 9 is FATAL.
	rasterMajor=11
	windowed=true
	screenWidth=1280
	screenHeight=720

[SharedFoundation]
	ProductRegistryPath=Software/whitengold/Default
	lookUpCallStackNames=false

[SharedLog]
	logReportLogs=1

[ClientGame]
	# Login server list, taken from the working client at
	# D:/Code/swg-client-v2/stage/client.cfg (LAUNCH-01 / D-06: the VM).
	#
	# These MUST be the INDEXED form. SwgCuiLoginScreen.cpp:284-303 walks
	# loginServerAddress0, loginServerPort0, loginServerAddress1, ... and stops at
	# the first missing address; an entry is only accepted if its port is also
	# present and non-zero. The unindexed ConfigClientGame key
	# 'loginServerAddress' (default "localhost", port 44453) is a DIFFERENT key and
	# is not what the login page reads - setting only that one does nothing here.
	loginServerAddress0=192.168.1.200
	loginServerPort0=44453
	# SOE's obfuscated "show CSR/admin slash commands" switch (2026-08-29).
	# ConfigClientGame.cpp:1169 registers KEY_BOOL(0fd345d9); getCSR() returns it,
	# and CuiCommandTableParser::resetCommands skips every command in the 'csr'
	# display group (teleport among them) unless it is true. Client-side
	# visibility only - the server still validates god mode on every command.
	# Same key the working client sets (swg-client-v2/stage/client.cfg:80).
	0fd345d9=true

