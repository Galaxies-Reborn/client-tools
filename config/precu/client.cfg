# Dedicated SWGSource Publish 14.1 client configuration.
# Keep the archive order in precu_live.cfg intact and do not add NGE TOCs.

.include "precu_login.cfg"
.include "precu_live.cfg"
.include "precu_preload.cfg"
.include "options.cfg"
.include "user.cfg"

# The x64/NGE-derived renderer interprets the Publish 14 tutorial hall's scene
# alpha as a full-frame bloom mask. Keep Bloom available in code, but lock it
# off for this dedicated compatibility profile so saved UI preferences cannot
# white out legacy interiors.
[ClientGame/Bloom]
	disable=true

# Direct3d9 recreates/repositions its window during scene and display-mode
# transitions. Lock the dedicated profile to non-activating window operations
# after user.cfg so saved preferences cannot steal focus from other work.
[Direct3d9]
	doNotActivateWindow=true
